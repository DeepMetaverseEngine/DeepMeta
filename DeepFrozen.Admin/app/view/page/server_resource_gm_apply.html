{% block script %}
<script type="text/javascript">
    $(document).ready(function() {
        $("#confirm").click(function() {
            if($('#form').parsley({ excluded: "[disabled]" }).validate()){

                if($("#role_list").val() == '-1'){
                    toastr.error("{{ __('page_gmt_select_server_first') }}");
                    return
                }
               sendData();
            }
        });

        $('#role_list').select2(
        {
            //minimumResultsForSearch:-1
        });


        $.getJSON('/api/backend/get_all_product_list', function(data) {
            $.each(data, function(){
                $("#product_list").append('<option value="'+ this.id +'">'+ this.name +'</option>');
            })
            $('#product_list').select2(
                {
                    placeholder: "{{ __('page_resource_gm_apply_content') }}",
                    minimumResultsForSearch:-1
                });
        })

    });

    function sendData(){
        var index = layer.load(2);
        $.ajax({    
            type:'post',        
            url:'/api/backend/resource_gm_apply',
            data:{
                id: $("#role_list").val(),
                product_id:  $("#product_list").val(),
            },
            cache:false,    
            dataType:'json',    
            success:function(obj){
                layer.close(index); 
                if(obj.state){
                    toastr.success(obj.reason);
                }else {
                    toastr.error(obj.reason);
                }
            }    
        });    
    }

</script>
