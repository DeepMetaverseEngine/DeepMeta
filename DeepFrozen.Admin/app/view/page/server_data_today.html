{% extends "base.nunjucks" %}
{% block js %}
        <script src="/public/assets/plugins/multiselect/js/jquery.multi-select.js"></script>
        <script src="/public/assets/plugins/bootstrap-tagsinput/dist/bootstrap-tagsinput.min.js"></script>
        <script src="/public/assets/plugins/parsleyjs/dist/parsley.min.js"></script>
        <script src="/public/assets/plugins/toastr/toastr.min.js"></script>
        <script src="/public/assets/plugins/select2/js/select2.min.js" type="text/javascript"></script>
        <script src="/public/assets/plugins/bootstrap-datepicker/dist/js/bootstrap-datepicker.min.js"></script>
        <script src="/public/js/moment.min.js"></script>
{% endblock %}

{% block css %}
        <link href="/public/assets/plugins/multiselect/css/multi-select.css"  rel="stylesheet" type="text/css" />
        <link href="/public/assets/plugins/bootstrap-tagsinput/dist/bootstrap-tagsinput.css" rel="stylesheet" />
        <link href="/public/assets/plugins/toastr/toastr.min.css" rel="stylesheet" type="text/css" />
        <link href="/public/assets/plugins/bootstrap-datepicker/dist/css/bootstrap-datepicker.min.css" rel="stylesheet">
        <link href="/public/assets/plugins/switchery/switchery.min.css" rel="stylesheet" />
        <link href="/public/assets/plugins/select2/css/select2.min.css" rel="stylesheet" type="text/css" />
{% endblock %}

{% block realms %}
{% endblock %}

{% block style %}
        <style type="text/css">
                    
        </style>
{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="card-box">
            <div class="row">
                <div class="col-8">
                    <div class="p-20">
                        <form action="#" id="form" data-parsley-validate>
                            <div class="form-group row">
                                <label class="col-2 col-form-label">{{ __('common_nevigate_field_servers') }}</label>
                                <div class="col-6">
                                    <select id="server_list" class="select2" multiple="multiple" required>
                                    {% for server in server_list %}
                                    {% if server.flag == 1 %}
                                <optgroup label="{{ server.realm_name }}">
                                    {% endif %}
                                <option value="{{ server.id }}">{{ server.name }}({{ server.id }})</option>
                                    {% if server.flag == 1 %}
                                    </optgroup>
                                    {% endif %}
                                {% endfor %}
                                    </select>
                                </div>
                            </div>
                            <div class="form-group row">
                                <div class="col-10">
                                    <button id="confirm" type="button" class="btn btn-success waves-effect w-md waves-light">{{ __('common_instructions_confirm') }}</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    <div class="card-box">
        <div class="row">
            <div id="res0" class="col-4" style="display: none;">
                <div class="p-20">
                    <div class="form-group row">
                        <div class="col-12">
                            <textarea id="result0" class="form-control" rows="30" disabled="disabled"></textarea>
                        </div>
                    </div>
                </div>
            </div>
            <div id="res1" class="col-4" style="display: none;">
                <div class="p-20">
                    <div class="form-group row">
                        <div class="col-12">
                            <textarea id="result1" class="form-control" rows="30" disabled="disabled"></textarea>
                        </div>
                    </div>
                </div>
            </div>
            <div id="res2" class="col-4" style="display: none;">
                <div class="p-20">
                    <div class="form-group row">
                        <div class="col-12">
                            <textarea id="result2" class="form-control" rows="30" disabled="disabled"></textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block script %}
<script type="text/javascript">
    var serverinfo;
    $(document).ready(function() {
        $('#server_list').select2(
        {
            placeholder: "{{ __('page_gmt_select_server_first')}}",
            maximumSelectionLength: 3
        });

        $("#confirm").click(function(){
            if($('#form').parsley().validate()) {
                sendData();
            }
        });
    });

    function sendData(){
        serverinfo = $('#server_list').select2('data');
        $.ajax({    
            type:'post',
            url:'/api/backend/bi/server_data_today',
            data:{
                server_id: $("#server_list").val(),
                },
            cache:false,
            dataType:'json',
            success:function(obj){
                if(obj.state){
                    showdata(obj.info);
                    toastr.success(obj.reason);
                }else {
                    toastr.error(obj.reason);
                }
            }    
        }); 
    }

    function showdata(data){
        $("#res0").hide();
        $("#res1").hide();
        $("#res2").hide();
        for (let k = 0; k < data.length; k++) {
            var inline = `${serverinfo[k].text}\t{{ __('page_bi_preview_title')}}： \n` + 
                        `{{ __('common_instructions_find')}}{{ __('common_instructions_datetime')}}：\t ${moment().format('YYYY-MM-DD HH:mm:ss')}\n` +
                        `{{ __('page_bi_remain_today_reg')}}：\t ${data[k].today_reg_num}\n` +
                        `{{ __('page_bi_preview_reg_sum')}}：\t ${data[k].sum_reg_and + data[k].sum_reg_ios}\n` +
                        `{{ __('page_bi_preview_reg_sum')}}(android)：\t ${data[k].sum_reg_and}\n` +
                        `{{ __('page_bi_preview_reg_sum')}}(ios)：\t ${data[k].sum_reg_ios}\n` +
                        `{{ __('common_instructions_today')}}{{ __('common_instructions_login')}}{{ __('page_bi_preview_person')}}：\t ${data[k].today_active_num}\n` +
                        `{{ __('common_instructions_today')}}{{ __('common_instructions_login')}}{{ __('page_bi_preview_person')}}(android)：\t ${data[k].today_active_num_and}\n` +
                        `{{ __('common_instructions_today')}}{{ __('common_instructions_login')}}{{ __('page_bi_preview_person')}}(ios)：\t ${data[k].today_active_num_ios}\n` +
                        `{{ __('common_instructions_online_on')}}{{ __('page_bi_preview_person')}}：\t ${data[k].online_sum}\n` +
                        `{{ __('common_instructions_today')}}{{ __('page_player_chargesum')}}：\t ${data[k].today_pay_total/100} ({{ __('common_instructions_money')}}) \n` +
                        `{{ __('page_bi_remain_today_reg')}}{{ __('page_bi_preview_pay_num')}}：\t ${data[k].today_new_pay_num}\n` +
                        `{{ __('page_bi_remain_today_reg')}}{{ __('page_bi_preview_pay_rato')}}：\t ${data[k].today_new_pay_rato}%\n` +
                        `{{ __('common_instructions_today')}}{{ __('page_bi_preview_pay_num')}}：\t ${data[k].today_pay_num}\n` +
                        `{{ __('common_instructions_today')}}{{ __('page_bi_preview_active')}}{{ __('page_bi_preview_pay_rato')}}：\t ${data[k].today_pay_rato}%\n` +
                        `{{ __('common_instructions_today')}}{{ __('page_bi_preview_active')}}arpu：\t ${data[k].active_arpu/100}\n` +
                        `{{ __('page_bi_preview_total_pay')}}：\t ${data[k].server_pay_num/100} ({{ __('common_instructions_money')}}) \n` +
                        `\n${serverinfo[k].text} {{ __('page_server_data_chargelist')}}top50（{{ __('page_server_data_LTV_unit')}}：{{ __('common_instructions_money')}}） \n` +
                        '+------------------+------------------+------------------+\n' +
                        '|   {{ __('common_instructions_role_id')}}   |  {{ __('common_instructions_role_name')}}   |   ({{ __('common_instructions_money')}})   |\n' +
                        '+------------------+------------------+------------------+\n'
                for (let i = 0; i < data[k].top_list.length; i++) {
                    inline += `|   ${data[k].top_list[i].role_id}   |  ${data[k].top_list[i].role_name}   |  ${data[k].top_list[i].topay / 100}   |\n`
                }
            $("#res" + k).show();
            $("#result" + k).val(inline);

        }
    }

</script>
{% endblock %}
