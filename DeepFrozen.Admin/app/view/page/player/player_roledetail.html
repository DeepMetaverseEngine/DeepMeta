{% extends "base.nunjucks" %}

{% block realms %}
{% endblock %}

{% block js %}
        <script src="/public/assets/plugins/multiselect/js/jquery.multi-select.js"></script>
        <script src="/public/assets/plugins/bootstrap-tagsinput/dist/bootstrap-tagsinput.min.js"></script>
        <script src="/public/assets/plugins/parsleyjs/dist/parsley.min.js"></script>
        <script src="/public/assets/plugins/toastr/toastr.min.js"></script>
        <script src="/public/assets/plugins/select2/js/select2.min.js" type="text/javascript"></script>
        <script src="/public/assets/plugins/bootstrap-datepicker/dist/js/bootstrap-datepicker.min.js"></script>
        <script src="/public/assets/plugins/datatables/jquery.dataTables.min.js"></script>
        <script src="/public/assets/plugins/datatables/dataTables.bootstrap4.min.js"></script>
        <script src="/public/assets/plugins/datatables/dataTables.buttons.min.js"></script>
        <script src="/public/assets/plugins/datatables/buttons.bootstrap4.min.js"></script>
        <script src="/public/assets/plugins/datatables/dataTables.select.min.js"></script>
        <script src="/public/assets/plugins/datatables-editor/dataTables.editor.min.js"></script>
        <script src="/public/assets/plugins/datatables-editor/editor.bootstrap4.min.js"></script>
        <script src="/public/js/moment.min.js"></script>
{% endblock %}

{% block css %}
        <link href="/public/assets/plugins/multiselect/css/multi-select.css"  rel="stylesheet" type="text/css" />
        <link href="/public/assets/plugins/bootstrap-tagsinput/dist/bootstrap-tagsinput.css" rel="stylesheet" />
        <link href="/public/assets/plugins/toastr/toastr.min.css" rel="stylesheet" type="text/css" />
        <link href="/public/assets/plugins/switchery/switchery.min.css" rel="stylesheet" />
        <link href="/public/assets/plugins/select2/css/select2.min.css" rel="stylesheet" type="text/css" />
        <link href="/public/assets/plugins/bootstrap-datepicker/dist/css/bootstrap-datepicker.min.css" rel="stylesheet">
        <link href="/public/assets/plugins/datatables/dataTables.bootstrap4.min.css" rel="stylesheet" type="text/css" />
        <link href="/public/assets/plugins/datatables/buttons.bootstrap4.min.css" rel="stylesheet" type="text/css" />
        <link href="/public/assets/plugins/datatables/select.bootstrap4.min.css" rel="stylesheet" type="text/css" />
        <link href="/public/assets/plugins/datatables-editor/editor.bootstrap4.min.css" rel="stylesheet" type="text/css" />
{% endblock %}

{% block style %}
        <style type="text/css">
        </style>
{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="card-box">
            <div class="row">
                <div class="col-8">
                    <div class="p-20">
                        <form action="#" id="form" data-parsley-validate>
                            <div class="form-group row">
                                <label class="col-2 col-form-label">{{ __('common_instructions_please_select') }}</label>
                                <div class="col-10" style="padding-left: 15px;">
                                    <div class="radio radio-info form-check-inline">
                                        <input type="radio" id="radio1" value="role_name" name="radio_role" checked>
                                        <label for="radio1">{{ __('common_instructions_role_name') }}</label>
                                    </div>
                                    <div class="radio radio-info form-check-inline">
                                        <input type="radio" id="radio2" value="role_id" name="radio_role">
                                        <label for="radio2">{{ __('common_instructions_role_id') }}</label>
                                    </div>
                                </div>
                            </div>

                            <div id="role_list" class="form-group row">
                                    <label class="col-2 col-form-label">{{ __('common_instructions_role_name') }}/{{ __('common_instructions_role_id') }}</label>
                                    <div class="col-8">
                                        <input type="text" id="role_field" value="" parsley-trigger="change" required placeholder="{{ __('common_instructions_role_name_tip') }}/{{__('common_instructions_role_id')}}"/>
                                    </div>
                            </div>
                            
                            <div class="form-group row">
                                <label class="col-2 col-form-label">{{ __('page_bi_remain_select_server') }}</label>
                                <div class="col-8">
                                   <select id="server_list" class="select2" required>
                                       {% for server in server_list %}
                                            {% if server.flag == 1 %}
                                    <optgroup label="{{ server.realm_name }}">
                                            {% endif %}
                                       <option value="{{ server.id }}">{{ server.name }}</option>
                                           {% if server.flag == 1 %}
                                    </optgroup>
                                            {% endif %}
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                            <div class="form-group row">
                                <div class="col-10">
                                    <button id="confirm" type="button" class="btn btn-success waves-effect w-md waves-light">{{ __('common_instructions_confirm') }}</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <div class="card-box">
                <div class="row">
                    <div id="res" class="col-12">
                        <div class="p-20">
                            <div class="form-group row">
                                <div class="col-12">
                                    <textarea id="result" class="form-control" rows="30" disabled="disabled"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block script %}
<script type="text/javascript">
    $(document).ready(function() {
        loadGroup();
        $("#confirm").click(function(){
            if($('#form').parsley().validate()) {
                if(! $('#role_field').val().match(/^\d+$/) && $("input[name='radio_role']:checked").val() == 'role_id'){
                    toastr.error("{{ __('common_instructions_role_id') }} is not digit");
                    return;
                }
                sendData();
            }
        });

        $('#server_list').select2(
        {
            //minimumResultsForSearch:-1
        });

        $('#role_field').tagsinput({
          maxTags: 1
        });
    });
    var table = $('#datatable').DataTable({
            select: true,
            scrollY: 550,
            paging: false,
            ordering: true,
            columns: [
            { data: 'server_id' },
              { data: 'account_id' },
              { data: 'digit_id' },
              { data: 'role_name' },
              { data: 'pro' },
              { data: 'role_level' },
              { data: 'fight_power' },
              { data: 'recharge_num' },
              { data: 'diamond_num' },
              { data: 'gold_num' },
              { data: 'online_state' },
              { data: 'last_online_time' },
            ],
            language: {
                "sProcessing": '{{ __("common_table_sProcessing") }}',
                "sLengthMenu": '{{ __("common_table_sLengthMenu") }}',
                "sZeroRecords": '{{ __("common_table_sZeroRecords") }}',
                "sInfo": '{{ __("common_table_sInfo") }}',
                "sInfoEmpty": '{{ __("common_table_sInfoEmpty") }}',
                "sInfoFiltered": '{{ __("common_table_sInfoFiltered") }}',
                "sInfoPostFix": '{{ __("common_table_sInfoPostFix") }}',
                "sSearch": '{{ __("common_table_sSearch") }}',
                "sUrl": '{{ __("common_table_sUrl") }}',
                "sEmptyTable": '{{ __("common_table_sEmptyTable") }}',
                "sLoadingRecords": '{{ __("common_table_sLoadingRecords") }}',
                "sInfoThousands": '{{ __("common_table_sInfoThousands") }}',
                "oPaginate": {
                    "sFirst": '{{ __("common_table_sFirst") }}',
                    "sPrevious": '{{ __("common_table_sPrevious") }}',
                    "sNext": '{{ __("common_table_sNext") }}',
                    "sLast": '{{ __("common_table_sLast") }}',
                },
                "oAria": {
                    "sSortAscending": '{{ __("common_table_sSortAscending") }}',
                    "sSortDescending": '{{ __("common_table_sSortDescending") }}',
                }
            },
            columnDefs : [
                { targets : 'state',
                  render : function (data, type, row) {
                    return data == '2' ? '{{ __('common_instructions_online_off') }}' : '{{ __('common_instructions_online_on') }}'
                  },
                },
                { targets : 'dt',
                  render : function (data, type, row) {
                    return moment.utc(data).local().format('YYYY-MM-DD HH:mm:ss');
                  },
                },
                { targets : 'jobs',
                  render : function (data, type, row) {
                        let jobs = [0, "{{ __('page_player_job1')}}", "{{ __('page_player_job2')}}", "{{ __('page_player_job3')}}", "{{ __('page_player_job4')}}",]
                        return jobs[data];
                  },
                },
            ],
        });
    function sendData(){
        var index = layer.load(2);
        $.ajax({
            type:'post',        
            url:'/api/backend/role_info',
            data:{
                role_name: $("#role_field").val(),
                query_type:  $("input[name='radio_role']:checked").val(),
                server_id: $("#server_list").val(),
                type: 1,
                },
            cache:false, 
            dataType:'json',    
            success:function(obj){
                layer.close(index); 
                if(obj.state){
                    table.clear().draw();
                    table.rows.add(obj.info).draw();
                    toastr.success(obj.reason);
                }else {
                    toastr.error(obj.reason);
                }
            }   
        });    
    }
</script>
{% endblock %}
