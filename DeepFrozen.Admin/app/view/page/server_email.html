{% block content %}
<div class="row">
                            <div class="col-12">
                                <div class="card-box">
                                    <h4 class="m-t-0 header-title">{{ __('common_instructions_title') }}</h4>
                                    <p class="text-muted m-b-30 font-14">
                                        {{ __('page_email_desc') }}
                                    </p>

                                    <div class="row">
                                        <div class="col-8">
                                            <div class="p-20">
                                                <form action="#" id="form" data-parsley-validate>
                                                    <div class="form-group row">
                                                        <label class="col-2 col-form-label">{{ __('common_instructions_head') }}</label>
                                                        <div class="col-10">
                                                            <input id="title" type="text" class="form-control" parsley-trigger="change" required
 Placeholder="{{ __('common_instructions_header_tip') }}">
                                                        </div>
                                                    </div>
                                      
                                                  
                                                    <div class="form-group row">
                                                        <label class="col-2 col-form-label">{{ __('common_instructions_body') }}</label>
                                                        <div class="col-10">
                                                            <textarea id="content" class="form-control" rows="8" parsley-trigger="change" required
 Placeholder="{{ __('common_instructions_content_tip') }}"></textarea>
                                                        </div>
                                                    </div>

                                                   



                                                    <div class="form-group row">
                                                        <label class="col-2 col-form-label">{{ __('common_instructions_users_selector') }}</label>
                                                        <div class="col-10" style="padding-left: 15px;">
                                                            <div class="radio radio-info form-check-inline">
                                                                <input type="radio" id="radio1" value="2" name="radio_user">
                                                                <label for="radio1"> {{ __('common_instructions_all_users') }} </label>
                                                            </div>

                                                            <div class="radio radio-info form-check-inline">
                                                                <input type="radio" id="radio3" value="3" name="radio_user">
                                                                <label for="radio3"> {{ __('common_instructions_specific_users') }} </label>
                                                            </div>
                                                        </div>
                                                    </div>

                                                     <div class="form-group row" id="level_d">
                                                        <label class="col-2 col-form-label">{{ __('common_instructions_level') }}≥</label>
                                                        <div class="col-2">
                                                            <input name="level" id="level" type="text" value="0" data-bts-min="0" data-bts-max="999" data-bts-init-val="" data-bts-step="1" data-bts-decimal="0" data-bts-step-interval="100" data-bts-force-step-divisibility="round" data-bts-step-interval-delay="500" data-bts-prefix="" data-bts-postfix="" data-bts-prefix-extra-class="" data-bts-postfix-extra-class="" data-bts-booster="true" data-bts-boostat="10" data-bts-max-boosted-step="false" data-bts-mousewheel="true" data-bts-button-down-class="btn btn-primary" data-bts-button-up-class="btn btn-primary"/>
                                                        </div>
                                                    </div>

                                                     <div class="form-group row" id="vip_d">
                                                        <label class="col-2 col-form-label">{{ __('common_instructions_vip_level') }}≥</label>
                                                        <div class="col-2">
                                                            <input name="vip" id="vip" type="text" value="0" data-bts-min="0" data-bts-max="999" data-bts-init-val="" data-bts-step="1" data-bts-decimal="0" data-bts-step-interval="100" data-bts-force-step-divisibility="round" data-bts-step-interval-delay="500" data-bts-prefix="" data-bts-postfix="" data-bts-prefix-extra-class="" data-bts-postfix-extra-class="" data-bts-booster="true" data-bts-boostat="10" data-bts-max-boosted-step="false" data-bts-mousewheel="true" data-bts-button-down-class="btn btn-primary" data-bts-button-up-class="btn btn-primary"/>
                                                        </div>
                                                    </div>

                                                    <div id="group_list" class="form-group row">
                                                        <label class="col-2 col-form-label">{{ __('common_instructions_server_group') }}</label>
                                                        <div class="col-10">
                                                            <select id="group_selector" multiple="multiple" class="multi-select" name="group_selector[]">
                                                        </select>
                                                        </div>
                                                    </div>

                                                    <div id="role_list" class="form-group row" style="display: none;">
                                                        <label class="col-2 col-form-label">{{ __('common_instructions_users_list') }}</label>

                                                        </div>
                                                    </div>

                                                    <div class="form-group row" id="reason_l">

                                                            <input id="reason" type="text" class="form-control" parsley-trigger="change" required>
                                                        </div>

                                                    <div class="form-group row">

                                                            <button type="button" id="refresh" class="btn btn-danger waves-effect w-md waves-light m-b-5">{{ __('page_email_refresh_items') }}</button>
                                                        </div>

                                                    </div>

                                                    

                                                    <div class="form-group row">
                                                        <div class="col-10">
                                                            <button id="confirm" type="button" class="btn btn-success waves-effect w-md waves-light">{{__('common_instructions_send')}}{{ __('common_instructions_apply') }}</button>
                                                        </div>
                                                    </div>

                                                    

                                                </form>
                                                        </div>
                                                    </div>
                                            </div>

                                        </div>
                            </div>
                         </div>



{% endblock %}

{% block script %}
<script type="text/javascript">
    var options = '';
    $(document).ready(function() {
        $("#confirm").click(function() {
            if($('#form').parsley({ excluded: "[disabled]" }).validate()){
                if($("input[name='radio_user']:checked").val() == null){
                    toastr.error("{{ __('page_email_receiver') }}");
                    return;
                }
                if($('#group_selector').val() == '' && $("input[name='radio_user']:checked").val() != '3')
                {
                    toastr.error("{{ __('common_instructions_select_group') }}");
                    return;
                }
               sendData();
            }
        });

        $("input[name='level']").TouchSpin({
                min: 0,
                max: 999,
                boostat: 10,
                maxboostedstep: 10,
            });

        $("input[name='vip']").TouchSpin({
                min: 0,
                max: 99,
                boostat: 10,
                maxboostedstep: 10,
            });

        loadData();

        $("#add").click(function() {
            var addItem = '<div class="form-group row" id="item-field">'+
            '<label class="col-2 col-form-label">{{ __('common_instructions_item') }}</label>'+
            '<div class="col-4">'+
             '<select id="item_id" class="select2 item_id">' + options + '</select>'+ 
            '</div>'+
            '<label class="col-1 col-form-label">{{ __('common_instructions_quantity') }}</label>'+
            '<div class="col-2">'+
                '<input name="item_num" id="item_num" type="text" value="1" data-bts-min="1" data-bts-max="9999999" data-bts-init-val="" data-bts-step="1" data-bts-decimal="0" data-bts-step-interval="100" data-bts-force-step-divisibility="round" data-bts-step-interval-delay="500" data-bts-prefix="" data-bts-postfix="" data-bts-prefix-extra-class="" data-bts-postfix-extra-class="" data-bts-booster="true" data-bts-boostat="10" data-bts-max-boosted-step="false" data-bts-mousewheel="true" data-bts-button-down-class="btn btn-primary" data-bts-button-up-class="btn btn-primary"/>'+
            '</div>'+
            '<div class="col-2" id="area-remove">'+
                '<button type="button" id="remove" class="btn btn-icon waves-effect waves-light btn-danger m-b-5 remove"> <i class="fa fa-remove"></i> </button>'+
            '</div>'+
        '</div>';

            $(this).parent().parent().before($(addItem)); 
            $("input[name='item_num']").TouchSpin({
                min: 1,
                max: 9999999,
                boostat: 10,
                maxboostedstep: 10,
            });

            $('.remove').each(function(k,v){
                $(v).unbind("click").click(function(event){
                    $(this).parent().parent().remove();
            　　});
            });

            $('.item_id').each(function(k,v){

                $(this).select2((
                {
                    placeholder: "{{ __('common_instructions_item_tip') }}",
                }));
            });
        });

        $("#refresh").click(function() {
            $('.remove').each(function(k,v){
                $(v).unbind("click")
                $(v).parent().parent().remove();
            });
            window.localStorage.removeItem('items')
            loadData()
            // window.location.reload()
        });
        loadGroup();
    });

    $("input[name='radio_user']").change(function(){
        var type = $(this).attr('id');
        if(type == 'radio3') {
            $('#role_list').show();
            $('#group_list').hide();
            $('#vip_d').hide();
            $('#level_d').hide();
            $('#role_field').removeAttr("disabled");
        }else {
            $('#role_list').hide();
            $('#group_list').show();
            $('#vip_d').show();
            $('#level_d').show();
            $('#role_field').attr('disabled','disabled');
        }
    });

    $("input[name='item_num']").TouchSpin({
                buttondown_class: "btn btn-primary",
                buttonup_class: "btn btn-primary"
            });

    function sendData(){
        var index = layer.load(2);
        var item_list =[];
        $('.item_id').each(function(){
            item_list.push({id:$(this).val(), num:$(this).parent().parent().find('#item_num').val()});
        });
        console.log(item_list)
        $.ajax({    
            type:'post',        
            url:'/api/backend/email',
            data:{
               title: $("#title").val(),
               content:  $("#content").val(),
               type: $("input[name='radio_user']:checked").val(),
               level: $("#level").val(),
               vip: $("#vip").val(),
               group: getServerGroups(),
               role_list: $("#role_field").val(),
               reason: $("#reason").val(),
               item_list: item_list
            },
            cache:false,    
            dataType:'json',    
            success:function(obj){
                layer.close(index); 
                if(obj.state){
                    toastr.success(obj.reason);
                }else {
                    toastr.error(obj.reason);
                }
            }    
        });    
    }

    function loadData(){
        if(!window.localStorage){
             alert("浏览器不支持localstorage");
        }else{
            var storage=window.localStorage;
            var items=storage.getItem("items");
            if(items && items != 'undefined'){
                options = '';
                $.each($.parseJSON(items),function(name,value){
                    options += '<option value="'+ name +'">'+ value + '(' + name +')</option>'
                    
            })
            }else{
                get_all_item();
            }
        }
        
    }

    function get_all_item(){
        $.getJSON('/api/backend/get_all_item', function(data) {
            if(window.localStorage){
                window.localStorage.setItem("items",JSON.stringify(data));
            }
            options = '';
            $.each(data,function(name,value){
                options += '<option value="'+ name +'">'+ value + '(' + name +')</option>'
            })
        })
    }

    $.extend({
        change_realm_event:function(){
            $('#group_selector').empty();
            $('#group_selector').multiSelect('refresh');
            loadGroup();
        }
    });
</script>
{% endblock %}
