# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Publish
      run: dotnet publish DeepMetaGame.CLI/DeepMetaGame.CLI.csproj -c Debug -f net10.0 -p:PublishProfile=DeepMetaGame.CLI/Properties/PublishProfiles/FolderProfile.pubxml
